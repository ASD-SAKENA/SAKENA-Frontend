name: CI/CD Frontend

# Fail fast → build/push GHCR → scan → k8s deploy (namespace `sakena`) → verify.
# NEXT_PUBLIC_* are baked in at build time via secrets / build-args.
#
# `ci` also runs on pull requests so a broken build/typecheck/lint never
# reaches `main` in the first place; build/scan/deploy only run on pushes to
# `main` (or tags), same gating as before.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/asd-sakena/sakena-frontend
  NAMESPACE: sakena
  DEPLOYMENT: sakena-frontend
  CONTAINER: sakena-frontend

concurrency:
  group: frontend-cicd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint, format
        run: pnpm check

  build-and-push:
    name: Build, scan & push
    needs: [ci]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short sha
        id: vars
        run: echo "sha_short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_BASE=${{ secrets.NEXT_PUBLIC_API_BASE }}
            NEXT_PUBLIC_CURRENT_URL=${{ secrets.NEXT_PUBLIC_CURRENT_URL }}
            NEXT_PUBLIC_GA_ID=${{ secrets.NEXT_PUBLIC_GA_ID }}

      # Scans the tag we're about to deploy. A CRITICAL finding fails the
      # job here, before the deploy job (which needs this one) ever runs -
      # the image stays published under its sha tag for forensics, but
      # nothing rolls it out.
      - name: Scan image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.29.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ steps.vars.outputs.sha_short }}
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  deploy:
    name: Deploy
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE_TAG: sha-${{ needs.build-and-push.outputs.image_tag }}
    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Write kubeconfig
        run: |
          set -euo pipefail
          install -m 600 /dev/null "$RUNNER_TEMP/kubeconfig"
          echo "${{ secrets.KUBE_CONFIG_SAKENA }}" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Roll out new image
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" set image "deployment/$DEPLOYMENT" \
            "$CONTAINER=$IMAGE_NAME:$IMAGE_TAG" --record=false

      - name: Wait for rollout, roll back on failure
        run: |
          set -euo pipefail
          if ! kubectl -n "$NAMESPACE" rollout status "deployment/$DEPLOYMENT" --timeout=180s; then
            echo "::error::Rollout failed - rolling back deployment/$DEPLOYMENT"
            kubectl -n "$NAMESPACE" rollout undo "deployment/$DEPLOYMENT"
            kubectl -n "$NAMESPACE" rollout status "deployment/$DEPLOYMENT" --timeout=120s || true
            echo "--- describe ---"
            kubectl -n "$NAMESPACE" describe "deployment/$DEPLOYMENT"
            echo "--- recent pod logs ---"
            kubectl -n "$NAMESPACE" logs -l app="$DEPLOYMENT" --tail=100 --since=10m || true
            exit 1
          fi

      - name: Smoke test
        run: |
          set -euo pipefail
          for i in $(seq 1 15); do
            if curl -fsS https://sakena.aptcodegen.online/api/health | grep -q '"status":"ok"'; then
              echo "Frontend is healthy"
              exit 0
            fi
            sleep 4
          done
          echo "::error::Smoke test failed - frontend did not report healthy after rollout"
          exit 1
